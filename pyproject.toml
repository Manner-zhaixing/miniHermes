[project]
name = "minihermes"
version = "1.1.7"
description = "MiniHermes - A lightweight AI coding assistant (CLI + desktop backend)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "rich>=14.0.0",
    "prompt-toolkit>=3.0.52",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "beautifulsoup4>=4.12.0",
    "e2b-code-interpreter",
    "python-dotenv",
    "exa-py>=1.0",
]

[project.scripts]
minihermes = "minihermes.main:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

# 桌面端后端（desktop/backend/server.py）运行与打包依赖。
# 加入默认组，避免 uv sync 误删；requirements.txt 保留作为单独安装的替代入口。
[dependency-groups]
desktop = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minihermes"]
# 包数据（config.yaml 模板 + _builtin_skills/）在包目录内，hatchling 默认随 wheel 发布

[tool.uv]
managed = true
default-groups = ["desktop"]
