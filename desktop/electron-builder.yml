# MiniHermes Desktop 打包配置
appId: com.minihermes.desktop
productName: MiniHermes Desktop
directories:
  buildResources: build
  output: release

files:
  - electron/**/*
  - dist/**/*
  - package.json
  - "!backend/**/*"

# Python 后端可执行（PyInstaller 产物）随包携带
extraResources:
  - from: build/backend
    to: backend
    filter:
      - "**/*"

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  target:
    - dmg
    - zip
  # 无开发者证书时使用 ad-hoc 签名
  # 注意：identity: null = 完全不签名（启动即崩 task_name_for_pid failure 5）
  # 正确做法是 identity: "-"（真正的 ad-hoc）+ 关闭 hardened runtime（避免 Team ID 校验冲突）
  identity: "-"
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# GitHub 发布配置
publish:
  provider: github
  owner: Manner-zhaixing
  repo: miniHermes

npmRebuild: false

# electron zip 下载走国内镜像（GitHub releases 直连超时）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
