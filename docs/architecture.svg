      <rect x="230" y="344" width="130" height="34" rx="9" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.8"/>
      <text x="295" y="366" text-anchor="middle" font-weight="500">技能系统</text>
      <rect x="374" y="344" width="130" height="34" rx="9" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.8"/>
      <text x="439" y="366" text-anchor="middle" font-weight="500">会话持久化</text>
      <rect x="518" y="344" width="116" height="34" rx="9" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.8"/>
      <text x="576" y="366" text-anchor="middle" font-weight="500">Plan 模式</text>
